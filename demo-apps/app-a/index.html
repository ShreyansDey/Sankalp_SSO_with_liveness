<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App A — Photography Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f0f9ff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e0f2fe;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--primary);
    }
    .badge {
      background: #e0f2fe;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    main {
      flex: 1;
      max-width: 600px;
      margin: 40px auto;
      width: 100%;
      padding: 0 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f1f5f9; color: var(--text); border: 1px solid #cbd5e1; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: var(--danger); color: #fff; }
    .user-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      margin-bottom: 20px;
    }
    .user-prop { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.88rem; }
    .user-prop-name { color: var(--muted); }
    .user-prop-val { font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .denied-card {
      background: #fef2f2;
      border: 2px solid #f87171;
      color: #991b1b;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }
    .denied-card h2 { font-size: 1.6rem; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      📸 <span>Photography Club</span>
      <span class="badge">App A</span>
    </div>
    <div id="nav-actions"></div>
  </header>

  <main id="app-root">
    <div class="card">
      <div style="font-size: 3rem; margin-bottom: 12px;">📷</div>
      <h1>Photography Club Portal</h1>
      <p>Sign in using your central digital identity to access studio equipment, darkroom bookings, and photo galleries.</p>
      <button class="btn btn-primary" onclick="initiateLogin()">
        Sign In with Sankalp SSO
      </button>
    </div>
  </main>

  <script>
    const CLIENT_ID = "app-a";
    const CLIENT_SECRET = "secret-app-a-key-2026";
    const AUTH_SERVER = "http://localhost:8000";
    const REDIRECT_URI = "http://localhost:5174/callback";

    function initiateLogin() {
      const state = "state_photo_" + Math.random().toString(36).substring(7);
      sessionStorage.setItem("oauth_state", state);
      window.location.href = `${AUTH_SERVER}/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&state=${state}`;
    }

    async function handleCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      if (!code) return false;

      // Clean URL
      window.history.replaceState({}, document.title, window.location.pathname);

      document.getElementById("app-root").innerHTML = `
        <div class="card">
          <h1>Exchanging One-Time Code...</h1>
          <p>Calling POST /token with authorization code (valid 60s)</p>
        </div>
      `;

      try {
        const res = await fetch(`${AUTH_SERVER}/token`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            grant_type: "authorization_code",
            code: code,
            client_id: CLIENT_ID,
            client_secret: CLIENT_SECRET
          })
        });

        if (!res.ok) {
          const err = await res.json();
          renderAccessDenied(err.message || "Token exchange failed");
          return true;
        }

        const data = await res.json();
        sessionStorage.setItem("access_token", data.access_token);
        sessionStorage.setItem("refresh_token", data.refresh_token);
        renderAuthenticated();
        return true;
      } catch (e) {
        renderAccessDenied(e.message || "Network error");
        return true;
      }
    }

    async function fetchUserInfo() {
      const token = sessionStorage.getItem("access_token");
      if (!token) return null;

      try {
        const res = await fetch(`${AUTH_SERVER}/userinfo`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.status === 403 || res.status === 401) {
          // Token expired or user disabled! Try refresh
          return await refreshToken();
        }
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function refreshToken() {
      const rf = sessionStorage.getItem("refresh_token");
      if (!rf) return null;

      try {
        const res = await fetch(`${AUTH_SERVER}/token/refresh`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            refresh_token: rf,
            client_id: CLIENT_ID,
            client_secret: CLIENT_SECRET
          })
        });

        if (!res.ok) {
          sessionStorage.clear();
          renderAccessDenied("Account disabled or refresh token revoked.");
          return null;
        }

        const data = await res.json();
        sessionStorage.setItem("access_token", data.access_token);
        return await fetchUserInfo();
      } catch (e) {
        return null;
      }
    }

    function renderAccessDenied(reason = "Access Revoked") {
      document.getElementById("nav-actions").innerHTML = "";
      document.getElementById("app-root").innerHTML = `
        <div class="denied-card">
          <div style="font-size: 3.5rem; margin-bottom: 12px;">🚫</div>
          <h2>ACCESS DENIED</h2>
          <p style="color: #b91c1c; font-weight: 600; margin-bottom: 16px;">
            ${reason}
          </p>
          <div style="font-size: 0.88rem; color: #7f1d1d; margin-bottom: 24px; line-height: 1.6;">
            Your account has been marked as left or disabled by the organization administrator. All sessions and refresh tokens have been immediately revoked.
          </div>
          <button class="btn btn-secondary" onclick="sessionStorage.clear(); window.location.href='/';">
            Return to Login
          </button>
        </div>
      `;
    }

    async function renderAuthenticated() {
      const user = await fetchUserInfo();
      if (!user) return;

      document.getElementById("nav-actions").innerHTML = `
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.82rem;" onclick="signOut()">
          Sign Out
        </button>
      `;

      document.getElementById("app-root").innerHTML = `
        <div class="card">
          <div style="font-size: 3rem; margin-bottom: 8px;">🎉</div>
          <h1>Welcome, ${user.name}!</h1>
          <p>You have successfully authenticated into <strong>App A (Photography Club)</strong> via Sankalp SSO.</p>

          <div class="user-box">
            <div class="user-prop">
              <span class="user-prop-name">Email:</span>
              <span class="user-prop-val">${user.email}</span>
            </div>
            <div class="user-prop">
              <span class="user-prop-name">Role:</span>
              <span class="user-prop-val">${user.role}</span>
            </div>
            <div class="user-prop">
              <span class="user-prop-name">Status:</span>
              <span class="user-prop-val" style="color: var(--success);">${user.status}</span>
            </div>
            <div class="user-prop">
              <span class="user-prop-name">Token Expiry:</span>
              <span class="user-prop-val">10 minutes (JWT)</span>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 12px;">
            <a href="http://localhost:5175" target="_blank" class="btn btn-primary" style="background: #16a34a;">
              ⚡ Open App B (One-Click SSO Part)
            </a>
            <div style="display: flex; gap: 10px;">
              <button class="btn btn-secondary" style="flex: 1;" onclick="testToken()">
                Test Access Token
              </button>
              <button class="btn btn-secondary" style="flex: 1;" onclick="refreshToken().then(() => alert('Token refreshed successfully!'))">
                Refresh Token
              </button>
            </div>
          </div>
        </div>
      `;
    }

    async function testToken() {
      const user = await fetchUserInfo();
      if (user) {
        alert(`Token valid! Verified identity: ${user.name} (${user.email})`);
      }
    }

    function signOut() {
      sessionStorage.clear();
      window.location.href = "http://localhost:8000/auth/logout";
    }

    // Main Init
    (async () => {
      const isCallback = await handleCallback();
      if (!isCallback) {
        if (sessionStorage.getItem("access_token")) {
          renderAuthenticated();
        }
      }
    })();
  </script>
</body>
</html>
