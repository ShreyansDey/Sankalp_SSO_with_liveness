<!doctype html>
<!--
================================================================================
REAL ACCESS / SANKALP SSO — CONNECTED DEMO APP B: ROBOTICS LAB
================================================================================
In plain words (Layman):
  This is the official portal for the University Robotics Lab (running on port 5175).
  Just like the Photography Club, it connects to the central SSO server on port 8000.
  When a student has signed into Real Access, clicking "Open" instantly opens this lab
  without asking for their password again (Single Sign-On).
  If an admin marks the student as "left", the next time the app checks the token,
  access is immediately denied.

Technical Architecture:
  - Port: 5175
  - Client ID: app-b
  - Secret: secret-app-b-key-2026
  - Callback URL: http://localhost:5175/callback
  - Standard OAuth 2.0 Authorization Code Flow
  - Real-time token validation against GET /userinfo
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotics Lab — Real Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #F3EFE7; font-family: 'Inter', system-ui, sans-serif; color: #12171E; }
  a { color: #12171E; text-underline-offset: 3px; }
  a:hover { color: #8A4A0F; }
  button { font-family: inherit; cursor: pointer; }
  a:focus-visible, button:focus-visible { outline: 2px solid #D9822B; outline-offset: 2px; }
  @media (max-width: 768px) {
    header > div, [style*="padding: 28px 48px"], [style*="padding: 10px 48px"] { padding: 14px 16px !important; }
    div[style*="padding: 40px 48px"] { padding: 20px 14px !important; gap: 20px !important; }
    div[style*="padding: 48px"] { padding: 24px 16px !important; }
    h1 { font-size: clamp(24px, 5.5vw, 34px) !important; }
  }
</style>
</head>
<body>

<div id="app-root">
  <!-- Initial Unauthenticated State -->
  <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #FBF9F4; border: 1px solid #DDD6C7; border-radius: 16px; padding: 48px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.04);">
      <div style="width: 64px; height: 64px; border-radius: 16px; background: #12171E; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F5F1E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <line x1="8" y1="16" x2="8" y2="16"></line>
          <line x1="16" y1="16" x2="16" y2="16"></line>
        </svg>
      </div>
      <h1 style="font-family: 'Newsreader', Georgia, serif; font-size: 32px; font-weight: 500; margin: 0 0 10px;">Robotics Lab</h1>
      <p style="color: #5A6270; font-size: 15px; line-height: 1.5; margin: 0 0 28px;">
        Hardware benches, microcontroller kits, 3D printer queue, and ROS compute clusters. Single sign-on authentication.
      </p>
      <button onclick="initiateLogin()" style="height: 48px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600; color: #F5F1E8; background: #12171E; border: 0; border-radius: 8px;">
        Sign in with Real Access
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9h12M10 4l5 5-5 5" stroke="#F5F1E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
    </div>
  </div>
</div>

<script>
  const CLIENT_ID = "app-b";
  const CLIENT_SECRET = "secret-app-b-key-2026";
  const AUTH_SERVER = window.location.protocol + "//" + window.location.hostname + ":8001";
  const REDIRECT_URI = window.location.origin + "/callback";

  function initiateLogin() {
    const state = "state_robotics_" + Math.random().toString(36).substring(7);
    sessionStorage.setItem("oauth_state", state);
    window.location.href = `${AUTH_SERVER}/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&state=${state}`;
  }

  async function handleCallback() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get("code");
    if (!code) return false;

    window.history.replaceState({}, document.title, window.location.pathname);
    document.getElementById("app-root").innerHTML = `
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="background: #FBF9F4; border: 1px solid #DDD6C7; border-radius: 14px; padding: 32px; text-align: center;">
          <h2 style="font-family: 'Newsreader', Georgia, serif;">Authenticating with Real Access...</h2>
          <p style="color: #5A6270; font-size: 14px;">Exchanging authorization code for session tokens.</p>
        </div>
      </div>
    `;

    try {
      const res = await fetch(`${AUTH_SERVER}/token`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          grant_type: "authorization_code",
          code: code,
          client_id: CLIENT_ID,
          client_secret: CLIENT_SECRET
        })
      });

      if (!res.ok) {
        const err = await res.json();
        renderAccessDenied(err.message || "Token verification failed");
        return true;
      }

      const data = await res.json();
      sessionStorage.setItem("access_token", data.access_token);
      sessionStorage.setItem("refresh_token", data.refresh_token);
      renderAuthenticated();
      return true;
    } catch (e) {
      renderAccessDenied(e.message || "Network error connecting to auth server");
      return true;
    }
  }

  async function fetchUserInfo() {
    const token = sessionStorage.getItem("access_token");
    if (!token) return null;

    try {
      const res = await fetch(`${AUTH_SERVER}/userinfo`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.status === 403 || res.status === 401) {
        return await refreshToken();
      }
      return await res.json();
    } catch (e) {
      return null;
    }
  }

  async function refreshToken() {
    const rf = sessionStorage.getItem("refresh_token");
    if (!rf) return null;

    try {
      const res = await fetch(`${AUTH_SERVER}/token/refresh`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          refresh_token: rf,
          client_id: CLIENT_ID,
          client_secret: CLIENT_SECRET
        })
      });

      if (!res.ok) {
        sessionStorage.clear();
        renderAccessDenied("Account disabled. Access to all connected clubs has been revoked.");
        return null;
      }

      const data = await res.json();
      sessionStorage.setItem("access_token", data.access_token);
      return await fetchUserInfo();
    } catch (e) {
      return null;
    }
  }

  function renderAccessDenied(reason = "Access Revoked") {
    document.getElementById("app-root").innerHTML = `
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: #FBF9F4; border: 2px solid #9B3A22; border-radius: 16px; padding: 48px; max-width: 500px; width: 100%; text-align: center;">
          <div style="width: 56px; height: 56px; border-radius: 50%; background: #F6DDD4; color: #9B3A22; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 26px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9B3A22" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></div>
          <h2 style="font-family: 'Newsreader', Georgia, serif; font-size: 32px; color: #9B3A22; margin: 0 0 10px;">ACCESS DENIED</h2>
          <div style="font-size: 15px; font-weight: 500; color: #9B3A22; margin-bottom: 16px;">${reason}</div>
          <p style="color: #5A6270; font-size: 14px; line-height: 1.6; margin: 0 0 28px;">
            Your account has been marked as left or expired. All sessions and refresh tokens were terminated immediately.
          </p>
          <button onclick="sessionStorage.clear(); window.location.href='http://localhost:5180';" style="height: 44px; padding: 0 24px; font-size: 14px; font-weight: 600; color: #12171E; background: transparent; border: 1px solid #12171E; border-radius: 8px;">
            Return to Central Portal
          </button>
        </div>
      </div>
    `;
  }

  async function renderAuthenticated() {
    const user = await fetchUserInfo();
    if (!user) return;

    document.getElementById("app-root").innerHTML = `
      <div style="min-height: 100vh; display: flex; flex-direction: column;">
        
        <!-- Top SSO Strip -->
        <div style="background: #12171E; color: #D8D2C4;">
          <div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 10px 48px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <svg width="18" height="18" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="#D9822B" stroke-width="2.5"></circle><circle cx="16" cy="16" r="5" fill="#D9822B"></circle></svg>
              <span>${user.role === 'admin' ? 'Administrator Inspection Mode — Viewing as system supervisor' : `Signed in with Real Access as <strong style="font-weight: 600; color: #F5F1E8;">${user.name}</strong> (${user.email})`}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
              <a href="http://localhost:5180/clubs" style="color: #F5F1E8; text-decoration: underline; text-underline-offset: 3px;">Switch club</a>
              <a href="javascript:void(0)" onclick="signOut()" style="color: #F5F1E8; text-decoration: underline; text-underline-offset: 3px;">Sign out</a>
            </div>
          </div>
        </div>

        <!-- Club Header -->
        <header style="background: #E2DDF5; border-bottom: 1px solid #D3CBB9;">
          <div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 28px 48px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px;">
            <div style="display: flex; align-items: center; gap: 20px;">
              <div style="width: 64px; height: 64px; border-radius: 14px; background: #12171E; display: flex; align-items: center; justify-content: center;">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F5F1E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                  <circle cx="12" cy="5" r="2"></circle>
                  <path d="M12 7v4"></path>
                  <line x1="8" y1="16" x2="8" y2="16"></line>
                  <line x1="16" y1="16" x2="16" y2="16"></line>
                </svg>
              </div>
              <div>
                <div style="font-size: 13px; margin-bottom: 4px;"><a href="http://localhost:5180/clubs" style="color: #4A5260;">All clubs</a> <span style="color: #6B7280;">/</span> Robotics Lab</div>
                <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 38px; line-height: 1.1;">Robotics Lab</h1>
              </div>
            </div>
            ${user.role === 'admin' ? `
            <div style="font-size: 13px; font-weight: 500; color: #8A4A0F; background: #FDE8D7; border: 1px solid #D9822B; border-radius: 999px; padding: 6px 14px;">
              Administrator · Oversight
            </div>
            ` : `
            <div style="font-size: 13px; font-weight: 500; color: #1F6B3F; background: #DDEFE2; border-radius: 999px; padding: 6px 14px;">
              Member · Active
            </div>
            `}
          </div>
        </header>

        <!-- Main Content -->
        <div style="flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 40px 48px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px;">
          
          <main style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px;">
            <div style="display: flex; flex-wrap: wrap; gap: 24px;">
              
              <!-- Next Meeting Card -->
              <section style="flex: 2 1 340px; background: #12171E; color: #F5F1E8; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 20px;">
                <div style="font-size: 12px; font-weight: 600; letter-spacing: 2.2px; color: #D9822B;">NEXT EVENT</div>
                <div style="display: flex; align-items: center; gap: 20px;">
                  <div style="width: 72px; flex: none; text-align: center; background: #1B222C; border: 1px solid #2A3340; border-radius: 12px; padding: 10px 0;">
                    <div style="font-size: 12px; letter-spacing: 1.5px; color: #A9B0BA;">NOV</div>
                    <div style="font-family: 'Newsreader', Georgia, serif; font-size: 34px; font-weight: 500; line-height: 1;">24</div>
                  </div>
                  <div>
                    <h2 style="margin: 0 0 6px; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 26px; line-height: 1.2;">Autonomous Drone Navigation</h2>
                    <div style="font-size: 14px; color: #A9B0BA;">Monday, 5:00 PM · Lab Bench 4 & Arena</div>
                  </div>
                </div>
                ${user.role === 'admin' ? `
                <div style="font-size: 13px; color: #A9B0BA; font-style: italic; padding: 8px 0;">
                  Admin Oversight: Event RSVP and student attendance is disabled for administrators.
                </div>
                ` : `
                <button onclick="alert('RSVP confirmed!')" style="align-self: flex-start; height: 44px; padding: 0 24px; font-size: 14px; font-weight: 600; color: #12171E; background: #F5F1E8; border: 0; border-radius: 8px; cursor: pointer;">
                  I will be there
                </button>
                `}
              </section>

              <!-- Your Access Card -->
              <section style="flex: 1 1 280px; background: #FBF9F4; border: 1px solid #DDD6C7; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px;">
                <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 22px;">Your access</h2>
                <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 14px;">
                  <dt style="color: #5A6270;">Role</dt><dd style="margin: 0; font-weight: 500; text-transform: capitalize;">${user.role}</dd>
                  <dt style="color: #5A6270;">Ends on</dt><dd style="margin: 0; font-weight: 500;">${user.role === "admin" ? "Permanent (System Admin)" : "30 Jun 2027"}</dd>
                  <dt style="color: #5A6270;">Token</dt><dd style="margin: 0; font-weight: 500;">Valid (10 min JWT)</dd>
                </dl>
                <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #5A6270;">
                  Access ends automatically on this date. An admin can also end it earlier.
                </p>
                <button onclick="refreshToken().then(() => alert('Token verified and refreshed!'))" style="align-self: flex-start; height: 36px; padding: 0 14px; font-size: 13px; font-weight: 600; color: #12171E; background: transparent; border: 1px solid #B9B2A3; border-radius: 8px;">
                  Test Token Status
                </button>
              </section>
            </div>

            <!-- Announcements -->
            <section style="background: #FBF9F4; border: 1px solid #DDD6C7; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 8px;">
              <h2 style="margin: 0 0 8px; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 22px;">Announcements</h2>
              <div style="padding: 14px 0; border-top: 1px solid #E6E0D2;">
                <div style="font-size: 15px; font-weight: 500; line-height: 1.4;">ROS 2 Humble installed on all lab workstations</div>
                <div style="font-size: 13px; color: #5A6270; margin-top: 4px;">Posted yesterday</div>
              </div>
              <div style="padding: 14px 0 0; border-top: 1px solid #E6E0D2;">
                <div style="font-size: 15px; font-weight: 500; line-height: 1.4;">Prusa MK4 3D printing filaments restocked</div>
                <div style="font-size: 13px; color: #5A6270; margin-top: 4px;">Submit STL prints by Thursday</div>
              </div>
            </section>
          
            ${user.role === 'admin' ? `
            <!-- Club Members Roster (Admin Inspection View) -->
            <section style="background: #FBF9F4; border: 1px solid #DDD6C7; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 16px;">
              <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 22px;">Club Members Roster</h2>
                <span style="font-size: 12px; font-weight: 500; color: #8A4A0F; background: #FDE8D7; border: 1px solid #D9822B; border-radius: 999px; padding: 4px 12px;">Admin Oversight Mode</span>
              </div>
              <p style="margin: 0; font-size: 13.5px; color: #5A6270; line-height: 1.5;">
                As a system administrator, you have supervisory oversight of this club. Below are the enrolled student members:
              </p>
              <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                  <thead>
                    <tr style="text-align: left; font-size: 12px; color: #5A6270; border-bottom: 1px solid #E6E0D2;">
                      <th style="padding: 8px 12px;">STUDENT MEMBER</th>
                      <th style="padding: 8px 12px;">EMAIL</th>
                      <th style="padding: 8px 12px;">VALID UNTIL</th>
                      <th style="padding: 8px 12px;">STATUS</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr style="border-bottom: 1px solid #E6E0D2;">
                      <td style="padding: 10px 12px; font-weight: 500;">Rahul Sharma</td>
                      <td style="padding: 10px 12px; color: #5A6270;">rahul@club.edu</td>
                      <td style="padding: 10px 12px; color: #5A6270;">30 Jun 2027</td>
                      <td style="padding: 10px 12px; color: #1F6B3F; font-weight: 500;">Active</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #E6E0D2;">
                      <td style="padding: 10px 12px; font-weight: 500;">Priya Patel</td>
                      <td style="padding: 10px 12px; color: #5A6270;">priya@club.edu</td>
                      <td style="padding: 10px 12px; color: #5A6270;">31 Mar 2027</td>
                      <td style="padding: 10px 12px; color: #1F6B3F; font-weight: 500;">Active</td>
                    </tr>
                    <tr>
                      <td style="padding: 10px 12px; font-weight: 500;">Pooja Sen</td>
                      <td style="padding: 10px 12px; color: #5A6270;">inactive@club.edu</td>
                      <td style="padding: 10px 12px; color: #5A6270;">Term Expired</td>
                      <td style="padding: 10px 12px; color: #9B3A22; font-weight: 500;">Access Ended</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
            ` : ''}

          </main>
        </div>
      </div>
    `;
  }

  function signOut() {
    sessionStorage.clear();
    window.location.replace("http://localhost:5180/signed-out");
  }

  (async () => {
    const isCallback = await handleCallback();
    if (!isCallback) {
      if (sessionStorage.getItem("access_token")) {
        renderAuthenticated();
      }
    }
  })();
</script>
</body>
</html>
